[project]
name = "beginnerchess-server"
version = "2.0.0"
description = "Multiplayer server for BeginnerChess (free, open-source chess for beginners)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "websockets>=17.0,<18",
    "argon2-cffi>=25.1,<26",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[project.scripts]
beginnerchess-server = "beginnerchess_server.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
