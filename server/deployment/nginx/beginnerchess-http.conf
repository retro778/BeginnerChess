# BeginnerChess - stage 1 (before the certificate exists): HTTP only.
# Serves the Let's Encrypt challenge; everything else is redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name freedomnet.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
