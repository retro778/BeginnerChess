# BeginnerChess - final configuration: TLS on 443, WebSocket proxy for
# /chess/ws and the health check, Let's Encrypt renewal on 80.
# The game server itself listens on 127.0.0.1:8765 only.

limit_conn_zone $binary_remote_addr zone=bc_conn:10m;

map $http_upgrade $bc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name freedomnet.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name freedomnet.tech;

    ssl_certificate     /etc/letsencrypt/live/freedomnet.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freedomnet.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:bc_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 64k;
    access_log /var/log/nginx/beginnerchess.access.log;
    error_log  /var/log/nginx/beginnerchess.error.log warn;

    # The multiplayer WebSocket.
    location = /chess/ws {
        limit_conn bc_conn 20;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bc_connection_upgrade;
        proxy_set_header Host $host;
        # Replace (never append) the client address: clients cannot forge it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than the server's 20 s heartbeat.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location = /chess/health {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /chess/ {
        default_type text/plain;
        return 200 "Beginner Chess multiplayer server.\nPlay with the free Beginner Chess program: Play Online.\n";
    }

    location / {
        return 404;
    }
}
